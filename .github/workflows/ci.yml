name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

      - name: Run runtime smoke test
        run: python tests/smoke_runtime.py

      - name: Validate read-only Compose example
        shell: bash
        run: |
          set -euo pipefail
          dummy_dir="$(mktemp -d)"
          cleanup() {
            rm -rf "$dummy_dir"
          }
          trap cleanup EXIT
          : > "$dummy_dir/client-id"
          : > "$dummy_dir/client-secret"
          : > "$dummy_dir/caller-token"
          chmod 600 "$dummy_dir/client-id" "$dummy_dir/client-secret" "$dummy_dir/caller-token"

          export OMADA_BASE_URL="https://controller.example.invalid"
          export OMADA_CONTROLLER_ID="ci-dummy-controller"
          export OMADA_CERT_SHA256="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          export OMADA_CLIENT_ID_HOST_FILE="$dummy_dir/client-id"
          export OMADA_CLIENT_SECRET_HOST_FILE="$dummy_dir/client-secret"
          export OMADA_CONNECTOR_TOKEN_HOST_FILE="$dummy_dir/caller-token"
          docker compose version --short
          docker compose -f compose.yaml -f compose.read-only.example.yaml config --format json > "$dummy_dir/rendered.json"
          grep -Fxc '          create_host_path: false' compose.read-only.example.yaml > "$dummy_dir/false-source-count"
          [[ "$(cat "$dummy_dir/false-source-count")" == "3" ]]
          sed 's/create_host_path: false/create_host_path: true/g' \
            compose.read-only.example.yaml > "$dummy_dir/compose-read-only-true-probe.yaml"
          docker compose -f compose.yaml -f "$dummy_dir/compose-read-only-true-probe.yaml" \
            config --format json > "$dummy_dir/rendered-true-probe.json"

          RENDERED_COMPOSE_JSON="$dummy_dir/rendered.json" \
          TRUE_PROBE_COMPOSE_JSON="$dummy_dir/rendered-true-probe.json" python - <<'PY'
          import json
          import os

          with open(os.environ["RENDERED_COMPOSE_JSON"], encoding="utf-8") as stream:
              config = json.load(stream)
          with open(os.environ["TRUE_PROBE_COMPOSE_JSON"], encoding="utf-8") as stream:
              true_probe = json.load(stream)

          mount_labels = {
              "/run/secrets/omada_client_id": "client-id",
              "/run/secrets/omada_client_secret": "client-secret",
              "/run/secrets/connector_caller_token": "caller-token",
          }

          def host_path_state(document, target):
              service = document.get("services", {}).get("omada-connector", {})
              volume = next((item for item in service.get("volumes", [])
                             if item.get("target") == target), {})
              value = volume.get("bind", {}).get("create_host_path")
              if value is True:
                  return "true"
              if value is False:
                  return "false"
              return "missing"

          for target, label in mount_labels.items():
              print(f"create_host_path false-config {label}: {host_path_state(config, target)}")
              print(f"create_host_path true-probe {label}: {host_path_state(true_probe, target)}")
              assert host_path_state(config, target) != "true", \
                  f"false-rendered representation unexpectedly says true for {target}"
              # Compose omits the default true value from normalized JSON.
              assert host_path_state(true_probe, target) in {"true", "missing"}, \
                  f"true-rendered control was explicitly false for {target}"

          service = config.get("services", {}).get("omada-connector")
          assert isinstance(service, dict), "read-only service missing"
          assert service.get("read_only") is True, "root filesystem is not read-only"
          environment = service.get("environment", {})
          assert isinstance(environment, dict), "environment missing"
          assert environment.get("OMADA_ENABLE_WRITES") == "false", "writes are not disabled"
          assert environment.get("OMADA_BASE_URL") == "https://controller.example.invalid", "dummy URL mismatch"
          assert environment.get("OMADA_CERT_SHA256") == "a" * 64, "dummy pin mismatch"
          ports = service.get("ports", [])
          assert len(ports) == 1 and ports[0].get("host_ip") == "127.0.0.1" and \
                 str(ports[0].get("target")) == "8080" and \
                 str(ports[0].get("published")) == "18080", "publish is not loopback-only"
          volumes = service.get("volumes", [])
          assert len(volumes) == 3, "unexpected number of secret mounts"
          expected_targets = {
              "/run/secrets/omada_client_id",
              "/run/secrets/omada_client_secret",
              "/run/secrets/connector_caller_token",
          }
          assert {volume.get("target") for volume in volumes} == expected_targets, "unexpected mount targets"
          for volume in volumes:
              assert volume.get("type") == "bind", "mount is not a bind"
              assert volume.get("read_only") is True, "secret mount is writable"
              assert isinstance(volume.get("source"), str), "mount source missing"
          rendered = json.dumps(config).lower()
          assert "docker.sock" not in rendered, "Docker socket is mounted"
          PY

      - name: Build Docker image without build network
        run: docker build --network=none --tag omada-universal-connector:ci .

      - name: Probe Compose bind-source behavior without starting container
        shell: bash
        run: |
          set -euo pipefail
          dummy_dir="$(mktemp -d)"
          project_name="omada-mount-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_name="omada-mount-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          missing_source="$dummy_dir/intentionally-missing-caller-token"
          cleanup() {
            docker compose -p "$project_name" \
              -f compose.yaml \
              -f compose.read-only.example.yaml \
              -f "$dummy_dir/compose-probe.yaml" \
              down --remove-orphans --volumes >/dev/null 2>&1 || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true
            rm -rf "$dummy_dir"
          }
          trap cleanup EXIT
          : > "$dummy_dir/client-id"
          : > "$dummy_dir/client-secret"
          chmod 600 "$dummy_dir/client-id" "$dummy_dir/client-secret"
          [[ ! -e "$missing_source" ]]

          export OMADA_BASE_URL="https://controller.example.invalid"
          export OMADA_CONTROLLER_ID="ci-dummy-controller"
          export OMADA_CERT_SHA256="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          export OMADA_CLIENT_ID_HOST_FILE="$dummy_dir/client-id"
          export OMADA_CLIENT_SECRET_HOST_FILE="$dummy_dir/client-secret"
          export OMADA_CONNECTOR_TOKEN_HOST_FILE="$missing_source"

          cat > "$dummy_dir/compose-probe.yaml" <<EOF
          services:
            omada-connector:
              image: omada-universal-connector:ci
              pull_policy: never
              container_name: $container_name
              network_mode: none
              ports: !reset []
          EOF

          docker compose version --short
          if docker compose -p "$project_name" \
            -f compose.yaml \
            -f compose.read-only.example.yaml \
            -f "$dummy_dir/compose-probe.yaml" \
            create --no-build --pull never omada-connector; then
            echo "Compose unexpectedly created a container with a missing bind source" >&2
            exit 1
          fi
          if [[ -e "$missing_source" ]]; then
            echo "The false create_host_path setting created the missing source" >&2
            exit 1
          fi
          docker rm --force "$container_name" >/dev/null 2>&1 || true

          sed 's/create_host_path: false/create_host_path: true/g' \
            compose.read-only.example.yaml > "$dummy_dir/compose-read-only-true-probe.yaml"
          docker compose -p "$project_name" \
            -f compose.yaml \
            -f "$dummy_dir/compose-read-only-true-probe.yaml" \
            -f "$dummy_dir/compose-probe.yaml" \
            create --no-build --pull never omada-connector
          # Docker may defer creation of a legacy bind source until container
          # start.  A successful create with the true variant is the control;
          # this test intentionally never starts the container.
          [[ "$(docker inspect --format '{{.State.Status}}' "$container_name")" == "created" ]]
          [[ "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$container_name")" == "none" ]]
          echo "False variant rejected missing source; true control accepted it without starting."

      - name: Smoke test isolated read-only container
        shell: bash
        run: |
          set -euo pipefail
          container_name="omada-ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 10001:10001 \
            omada-universal-connector:ci

          ready=false
          for attempt in {1..20}; do
            if docker exec "$container_name" python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=1)' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 0.5
          done
          if [[ "$ready" != true ]]; then
            echo "Container health endpoint did not become ready" >&2
            docker logs --tail 200 "$container_name" >&2 || true
            exit 1
          fi

          docker exec "$container_name" python -c 'import json, urllib.request; health=json.load(urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=2)); state=json.load(urllib.request.urlopen("http://127.0.0.1:8080/state", timeout=2)); assert health.get("status") == "ok"; assert state.get("read_only") is True; assert state.get("journal_status") == "unconfigured"; assert state.get("approval_status") == "unconfigured"'
