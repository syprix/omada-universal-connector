name: Bug report
description: Report a reproducible connector problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include credentials, controller addresses, personal device information, packet captures, or raw network data. Report suspected security issues privately as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Connector commit or version
      description: Provide the commit SHA or release version.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Include controller family/version and client/runtime versions only if safe to share. Do not include hostnames, IPs, IDs, or secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a redacted error or minimal fixture when possible.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
